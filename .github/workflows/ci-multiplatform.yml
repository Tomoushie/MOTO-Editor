name: CI — Multi-Platform Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Restore
        run: dotnet restore MOTO-Editor.sln

      - name: Build (Release)
        run: dotnet build MOTO-Editor.sln -c Release --no-restore

      - name: Publish (self-contained, win-x64)
        run: |
          dotnet publish Moto.Editor/Moto.Editor.csproj -c Release -r win-x64 --self-contained true -o ./publish-win

      - name: Upload artifact (win-x64)
        uses: actions/upload-artifact@v4
        with:
          name: moto-editor-win-x64
          path: ./publish-win/**

  build-macos:
    name: Build macOS (osx-x64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload (macOS)
        run: dotnet workload install maui-maccatalyst

      - name: Restore
        run: dotnet restore MOTO-Editor.sln

      - name: Build (Release, maccatalyst)
        run: dotnet build MOTO-Editor.sln -c Release --no-restore -f net8.0-maccatalyst

      - name: Publish (self-contained, osx-x64)
        run: |
          dotnet publish Moto.Editor/Moto.Editor.csproj -c Release -f net8.0-maccatalyst -r osx-x64 --self-contained true -o ./publish-mac

      - name: Upload artifact (osx-x64)
        uses: actions/upload-artifact@v4
        with:
          name: moto-editor-osx-x64
          path: ./publish-mac/**

  build-linux:
    name: Build Linux (headless, linux-x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore (Core only, MAUI non supporté)
        run: dotnet restore Moto.Core/Moto.Core.csproj

      - name: Build Core (Release)
        run: dotnet build Moto.Core/Moto.Core.csproj -c Release --no-restore

      - name: Publish Core (self-contained, linux-x64)
        run: |
          dotnet publish Moto.Core/Moto.Core.csproj -c Release -r linux-x64 --self-contained true -o ./publish-linux

      - name: Upload artifact (linux-x64)
        uses: actions/upload-artifact@v4
        with:
          name: moto-editor-linux-x64-core
          path: ./publish-linux/**

  release:
    name: Release (si tag)
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create release archives
        run: |
          cd ./artifacts
          zip -r ../moto-editor-win-x64.zip moto-editor-win-x64/
          zip -r ../moto-editor-osx-x64.zip moto-editor-osx-x64/
          zip -r ../moto-editor-linux-x64.zip moto-editor-linux-x64-core/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            moto-editor-win-x64.zip
            moto-editor-osx-x64.zip
            moto-editor-linux-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
